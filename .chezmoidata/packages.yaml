packages:
  ubuntu:
    apt:
      - "jq"
      - "yq"
      - "ssh"
      - "zsh"
      - "git" # remove git as it is already needed
      - "fzf"
      - "vim"
      - "golang-1.23"
      - "python3"
      - "google-chrome-stable"
    appImage:
      - location: "https://github.com/neovim/neovim/releases/download/v0.12.5/nvim-linux-x86_64.appimage"
        path: "~/bash_custom"
        name: "nvim"
